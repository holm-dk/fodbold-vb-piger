<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}" />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}" />
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <div class="brand">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="Vejgaard BK" width="68" height="68" />
      <div>
        <h1>{{ site.title }}</h1>
        <p>Vejgaard Boldspilklub &middot; sæson 2026/27</p>
      </div>
    </div>
    <nav>
      <a href="#træning">Træning</a>
      <a href="#holdkasse">Holdkasse</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <span>U14 Piger · Vejgaard Boldspilklub</span>
    <a href="https://www.vejgaard-bk.dk">vejgaard-bk.dk</a>
  </footer>
</div>
</body>
</html>
